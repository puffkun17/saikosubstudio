name: CI (hosted line)

on:
  pull_request:
    # Also verify stacked PRs (base = another feat/* branch) so they show CI before retargeting.
    branches: [ cf-pages-hosted, 'feat/**' ]
  push:
    branches: [ cf-pages-hosted ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Core regression (merge algorithm)
        run: npm run test:core

      - name: Unit tests (task model / recognition / credits / worker job)
        run: npm run test:unit

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build (Vite MPA → Workers bundle)
        run: npm run build

      - name: Worker bundle dry run
        run: npx wrangler deploy --config dist/saikosubstudio/wrangler.json --dry-run

      - name: Corpus baseline (synthetic samples)
        run: npm run test:corpus

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Playwright e2e (pages + core path + offline shell)
        run: npx playwright test
        env:
          CI: true
