name: CI (hosted line)

on:
  pull_request:
    # Also verify stacked PRs (base = another feat/* branch) so they show CI before retargeting.
    branches: [ cf-pages-hosted, 'feat/**' ]
  push:
    branches: [ cf-pages-hosted ]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Core regression (merge algorithm)
        run: npm run test:core

      - name: Unit tests (task model / recognition / credits / worker job)
        run: npm run test:unit

      - name: Typecheck (app + worker)
        run: npm run typecheck

      - name: Worker types up to date (wrangler types --check)
        run: npx wrangler types workers/worker-configuration.d.ts --check

      - name: Lint
        run: npm run lint

      - name: Build (Vite MPA → Workers bundle)
        run: npm run build

      - name: Worker bundle dry run
        run: npx wrangler deploy --config dist/saikosubstudio/wrangler.json --dry-run

      - name: Corpus baseline (synthetic samples)
        run: npm run test:corpus

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Playwright e2e (pages + core path + offline shell)
        run: npx playwright test
        env:
          CI: true

  design-detect:
    # Deterministic UI anti-pattern scan (impeccable). Exit 2 = findings, 1 = could not scan; both fail the job.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: impeccable detect (src)
        run: npx --yes impeccable@4.8.0 detect --github src
        env:
          DO_NOT_TRACK: 1
