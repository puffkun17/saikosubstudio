name: Deploy Worker (Cloudflare Workers via Vite)

# Push to cf-pages-hosted -> build -> wrangler deploy to Worker "saikosubstudio"
# (custom domains dualsubs.quest + www.dualsubs.quest, switched 2026-10-13).
# Needs repo secret CLOUDFLARE_API_TOKEN (Workers Scripts:Edit). Without it the job builds and
# skips the deploy with a warning. Worker secret TMDB_API_KEY lives on the Worker, not here.
# The legacy Pages project "saikosubstudio" is kept (no custom domain) as rollback.

on:
  push:
    branches: [ cf-pages-hosted ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Worker (vite build + sw.js)
        run: npm run build
      - name: Verify output
        run: |
          test -f dist/saikosubstudio/wrangler.json
          test -f dist/client/sw.js
          test -f dist/client/libarchive/libarchive.wasm
          npx wrangler deploy --config dist/saikosubstudio/wrangler.json --dry-run

      - name: Deploy to Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e4817f5651bb4a362691fcbe72054f54
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN repo secret not set; skipped deploy (run wrangler deploy manually)."
            exit 0
          fi
          npx wrangler deploy --config dist/saikosubstudio/wrangler.json
