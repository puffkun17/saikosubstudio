name: Build check (Cloudflare Workers via vinext)

# Deployment itself is done by Cloudflare Workers Builds (Git integration):
#   - production branch: cf-pages-hosted
#   - non-production branches: preview URLs <branch>-saikosubstudio.<subdomain>.workers.dev
# This workflow only proves the Worker bundle builds and the SW is generated.
# The legacy Pages project "saikosubstudio" is kept as rollback until the custom domain is switched.

on:
  push:
    branches: [ cf-pages-hosted ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Worker (vite build + sw.js)
        run: npm run build
      - name: Verify output
        run: |
          test -f dist/server/wrangler.json
          test -f dist/client/sw.js
          test -f dist/client/libarchive/libarchive.wasm
          npx wrangler deploy --config dist/server/wrangler.json --dry-run
