<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img">
  <title>SubStudio</title>
  <defs>
    <linearGradient id="plate" x1="64" y1="40" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#254843"/>
      <stop offset="0.55" stop-color="#1a3d37"/>
      <stop offset="1" stop-color="#122e2a"/>
    </linearGradient>
  </defs>

  <!-- App squircle -->
  <rect width="512" height="512" rx="118" fill="url(#plate)"/>
  <rect x="22" y="22" width="468" height="468" rx="100" stroke="#f5f1ea" stroke-opacity="0.12" stroke-width="3"/>

  <!-- Letter S -->
  <text
    x="256"
    y="292"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="#f5f1ea"
    font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, sans-serif"
    font-size="310"
    font-weight="700"
    letter-spacing="-0.04em"
  >S</text>

  <!-- Coral subtitle cue -->
  <rect x="168" y="408" width="176" height="20" rx="10" fill="#ef8d5f"/>
</svg>
